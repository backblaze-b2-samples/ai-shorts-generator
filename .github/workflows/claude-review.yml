name: CI Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# AI review (code review, B2 standards, security) is handled by a local agent
# run against this repo. Once Claude Managed Agents is available, this will
# move to a hosted agent triggered by the PR webhook — no credentials needed
# in this workflow. See backblaze-labs/demand-side-ai#195.

jobs:
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: services/api
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Run Python tests
        working-directory: services/api
        run: |
          if [ -d "tests" ] && find tests \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            uv pip install --system pytest
            python -m pytest tests/
          else
            echo "No tests found — skipping. See backblaze-labs/demand-side-ai#195 for test scaffolding work."
          fi

      - name: Set up Node
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Set up pnpm
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.24.0

      - name: Install frontend dependencies
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --filter @ai-shorts-generator/web typecheck
