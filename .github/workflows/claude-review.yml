name: CI Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# AI review (code review, B2 standards, security) is handled by a local agent
# run against this repo. Once Claude Managed Agents is available, this will
# move to a hosted agent triggered by the PR webhook — no credentials needed
# in this workflow. See backblaze-labs/demand-side-ai#195.

jobs:
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: services/api
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Run Python tests
        working-directory: services/api
        run: |
          if [ -d "tests" ] && find tests \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            uv pip install --system pytest
            python -m pytest tests/
          else
            echo "No tests found — skipping. See backblaze-labs/demand-side-ai#195 for test scaffolding work."
          fi

      - name: Set up Node
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Set up pnpm
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      - name: Install frontend dependencies
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --filter @ai-shorts-generator/web typecheck
